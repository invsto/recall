[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "recallhq"
version = "0.8.0"
description = "A local knowledge base built from Claude Code, Codex, OpenCode, Pi, and ChatGPT conversations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["recall", "session-search", "coding-agents", "pi", "claude-code", "codex", "opencode", "chatgpt"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dependencies = []

[project.optional-dependencies]
# Recall MCP server (python -m recall_v2 serve).
v2 = ["mcp>=1.30,<2"]
semantic = [
  "fastembed>=0.3",
  "numpy>=1.24",
]

[project.scripts]
recall = "recall:main"

[tool.setuptools]
py-modules = ["recall"]
packages = [
  "recall_core",
  "recall_v2",
  "recall_v2.adapters",
  "recall_v2.api",
  "recall_v2.bench",
  "recall_v2.core",
  "recall_v2.extraction",
  "recall_v2.governance",
  "recall_v2.lifecycle",
  "recall_v2.migrate",
  "recall_v2.retrieval",
  "recall_v2.store",
]
